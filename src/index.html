            <h1 class="state-title">Enter your access code.</h1>

            <input id="code" class="field" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Access code" aria-label="Access code" />
            <button type="submit" class="pill">Continue</button>
          </div>
        </form>
        <section id="context-panel" class="state context-panel" hidden aria-labelledby="context-title">
          <button id="context-close" type="button" class="icon-btn panel-close" aria-label="Close"></button>

            <textarea id="context-text" class="field-area" rows="8" spellcheck="false" aria-labelledby="context-title"></textarea>
            <button id="context-file-btn" type="button" class="attach-btn" aria-label="Attach a file"></button>
          </div>
          <p class="state-text bad" id="context-error" role="alert" hidden></p>
          <input id="context-file" type="file" accept=".md,.txt,text/plain,text/markdown" hidden />
          <button id="context-clear" type="button" class="pill pill-quiet">Clear</button>
          <button id="context-save" type="button" class="pill">Save</button>
        </section>
        <div class="feed-wrap" id="feed-wrap">
          <div id="feed" class="feed" role="log" aria-label="Translation" aria-live="off" tabindex="0"></div>
          <nav id="chapters" class="chapters" aria-label="Chapters" hidden></nav>
        </div>

          <button id="context" type="button" class="text-btn">Notes</button>
          <button id="more" type="button" class="icon-btn" aria-label="More" aria-haspopup="menu" aria-expanded="false" aria-controls="menu"></button>

        <div id="menu" class="menu" role="menu" hidden>

        </div>

        </footer>

          <div class="idle-inner">
            <div class="idle-pad">
              <button id="toggle" type="button" class="start">Start</button>
            </div>
          </div>
        </div>
      </main>

              </div>
              <div class="replies-body" id="replies-body"></div>
            </div>
          </section>
          <div class="bar" id="bar">
            <button id="suggest" type="button" class="bar-round" aria-label="Suggest replies" disabled><span class="spark" id="spark" aria-hidden="true"></span></button>
            <div class="timer" id="timer">
              <span class="wave wave-idle" id="wave" aria-hidden="true"><i></i><i></i><i></i></span>
              <span id="elapsed" aria-hidden="true">0:00</span>
            </div>
            <button id="stop" type="button" class="stop" aria-label="Stop"></button>
          </div>
        </div>
      </div>
