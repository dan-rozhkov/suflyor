<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Suflyor</title>
    <link rel="stylesheet" href="./sidepanel.css" />
  </head>
  <body>
    <header>
      <label for="key">Soniox API key</label>
      <input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="Paste key" />
      <div class="row">
        <div id="target" class="target">No tab selected. Click the toolbar icon on the call tab.</div>
        <button id="toggle" type="button">Start</button>
      </div>
      <div id="status" class="status" role="status">Idle</div>
      <div id="diag" class="diag">Audio sent: 0.0 s, peak 0.00</div>
    </header>
    <main id="feed" aria-live="polite"></main>
    <script type="module" src="./sidepanel.ts"></script>
  </body>
</html>
